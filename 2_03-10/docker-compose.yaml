services: 
  frontend:
    image: sdzol/frontend
    build: 
      context: ../example-app/frontend
      platforms:
        - "linux/amd64"
    container_name: frontend-service
    ports:
      - 5001:5001
  backend:
    image: sdzol/backend
    build: 
      context: ../example-app/backend
      platforms:
        - "linux/amd64"
    container_name: backend-service
    ports:
      - 8080:8080
    depends_on: 
      - db
      - redis
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=secret-pw
  redis:
    image: redis
  db:
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=secret-pw
    volumes:
      - ./database:/var/lib/postgresql
  nginx:
    image: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80